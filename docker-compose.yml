services:
  db:
    image: postgres:15-alpine
    container_name: goapi_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: goapi
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/seed.sql

  api:
    build: .
    container_name: goapi_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://admin:admin@db:5432/goapi?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    volumes:
      - ./static:/app/static

  adminer:
    image: adminer:latest
    container_name: goapi_adminer
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db

volumes:
  postgres_data:
