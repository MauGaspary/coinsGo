<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoAPI - Banking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Tela de Login -->
        <div id="loginScreen" class="screen active">
            <div class="card">
                <div class="logo">
                    <h1>💰 GoAPI</h1>
                </div>
                <h2>Bem-vindo</h2>
                <p class="subtitle">Faça login para acessar sua conta</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Usuário</label>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Digite seu usuário"
                            required
                        >
                        <small>Teste: rafaela, anaclara, mauricio</small>
                    </div>

                    <div class="form-group">
                        <label for="token">Token</label>
                        <input 
                            type="password" 
                            id="token" 
                            placeholder="Digite seu token"
                            required
                        >
                        <small id="tokenHint">Token padrão: primeiro número da lista (123, 456, 789)</small>
                    </div>

                    <button type="submit" class="btn btn-primary">Entrar</button>
                    <p id="loginError" class="error"></p>
                </form>
            </div>
        </div>

        <!-- Tela do Dashboard -->
        <div id="dashboardScreen" class="screen">
            <header class="header">
                <div class="header-content">
                    <h1>💰 GoAPI</h1>
                    <button class="btn btn-logout" onclick="logout()">Sair</button>
                </div>
            </header>

            <main class="dashboard">
                <div class="welcome">
                    <h2>Bem-vindo, <span id="username"></span>!</h2>
                </div>

                <div class="card">
                    <h3>Saldo da Conta</h3>
                    <div class="balance-display">
                        <p id="balanceAmount" class="balance-amount">R$ 0,00</p>
                    </div>
                    <button class="btn btn-primary" onclick="loadBalance()">Atualizar Saldo</button>
                </div>

                <div class="card">
                    <h3>Operações</h3>
                    <div class="operations">
                        <button class="btn btn-secondary" onclick="alert('Transferência em desenvolvimento')">Transferir</button>
                        <button class="btn btn-secondary" onclick="alert('Extrato em desenvolvimento')">Ver Extrato</button>
                    </div>
                </div>

                <p id="errorMessage" class="error"></p>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
